name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs this change needs. Pull requests diff the merge commit
  # against its first parent (the base branch tip). Pushes to main run all jobs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.areas.outputs.ios }}
      deno: ${{ steps.areas.outputs.deno }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Test change detection
        run: .github/scripts/ci-areas-test.sh

      - name: Pick jobs
        id: areas
        run: |
          set -o pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            areas=$(git diff --name-only --no-renames HEAD^1 HEAD | .github/scripts/ci-areas.sh)
          else
            areas=$'ios=true\ndeno=true'
          fi
          echo "$areas"
          echo "$areas" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS build and test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # Target is ~5 min (build ~1 min, test ~3 min incl. simulator boot).
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7

      # Pinned release with checksum check, instead of whatever brew has today.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen --version && xcodegen generate

      # SwiftPM checkouts and the Clang/Swift module cache. Keyed on
      # Package.resolved (once the project has packages) and project.yml.
      - name: Cache SwiftPM and module cache
        uses: actions/cache@v6
        with:
          path: |
            SourcePackages
            DerivedData/ModuleCache.noindex
          key: ios-${{ runner.os }}-xcode26.6-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ios-${{ runner.os }}-xcode26.6-

      # Newest installed iOS 26 runtime, first iPhone on it.
      - name: Pick simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-26")))
            | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
            | last.value | map(select(.name | startswith("iPhone")))
            | first | "\(.udid) \(.name)"')
          echo "Using simulator: $udid"
          echo "udid=${udid%% *}" >> "$GITHUB_OUTPUT"

      # Same build number source and override as the fastlane upload lanes.
      - name: Pick build number
        id: build_number
        run: echo "number=$(ci_scripts/build_number.sh)" >> "$GITHUB_OUTPUT"

      # No .env in CI: the project's pre-build script writes a placeholder
      # Secrets.plist, so no secrets are needed. Signing is off, so the app has
      # no App Group entitlement; AppGroupContainer falls back to an in-memory
      # store only when running as a unit-test host (a normal launch throws).
      # -disableAutomaticPackageResolution makes xcodebuild use Package.resolved
      # as committed and fail if it is missing or out of date.
      - name: Build
        run: >
          xcodebuild build-for-testing
          -project PokerStats.xcodeproj
          -scheme PokerStats
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath DerivedData
          -clonedSourcePackagesDirPath SourcePackages
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.number }}

      # The app and widget extension must carry the same build number, taken
      # from the override. Also fails if the committed widget Info.plist
      # differs from what xcodegen generates from project.yml.
      - name: Check build numbers
        run: |
          git diff --exit-code -- PokerStatsWidgets/Info.plist
          ci_scripts/check_build_numbers.sh \
            DerivedData/Build/Products/Debug-iphonesimulator/PokerStats.app \
            "${{ steps.build_number.outputs.number }}"

      # Unit tests only. PokerStatsUITests is the fastlane screenshot suite.
      - name: Test
        run: >
          xcodebuild test-without-building
          -project PokerStats.xcodeproj
          -scheme PokerStats
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath DerivedData
          -resultBundlePath TestResults.xcresult
          -only-testing:PokerStatsTests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  deno:
    name: Edge functions (Deno)
    needs: changes
    if: needs.changes.outputs.deno == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      # Each function has its own deno.json import map, so run per folder.
      - name: Check and test
        run: |
          for dir in supabase/functions/*/; do
            echo "::group::$dir"
            (cd "$dir" && deno check *.ts && deno test --permit-no-files)
            echo "::endgroup::"
          done

  # The owner submits to App Review by hand. Always runs; it takes seconds.
  fastlane-guard:
    name: Fastlane never submits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Test the guard
        run: .github/scripts/fastlane-no-submit-test.sh

      - name: Check fastlane
        run: .github/scripts/fastlane-no-submit.sh fastlane

  # The one check branch protection requires. Always runs; passes when every
  # job passed or was skipped, fails if any failed or was cancelled.
  gate:
    name: CI passed
    needs: [changes, ios, deno, fastlane-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job ended as '$result'."; exit 1 ;;
            esac
          done
