name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs this change needs. Pull requests diff the merge commit
  # against its first parent (the base branch tip). Pushes to main run all jobs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.areas.outputs.ios }}
      deno: ${{ steps.areas.outputs.deno }}
      db: ${{ steps.areas.outputs.db }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Test change detection
        run: .github/scripts/ci-areas-test.sh

      - name: Pick jobs
        id: areas
        run: |
          set -o pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            areas=$(.github/scripts/ci-changed-files.sh | .github/scripts/ci-areas.sh)
          else
            areas=$'ios=true\ndeno=true\ndb=true'
          fi
          echo "$areas"
          echo "$areas" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS build and test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # Target is ~5 min (build ~1 min, test ~3 min incl. simulator boot).
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7

      # Pinned release with checksum check, instead of whatever brew has today.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen --version && xcodegen generate

      # SwiftPM checkouts and the Clang/Swift module cache. Keyed on
      # Package.resolved (once the project has packages) and project.yml.
      - name: Cache SwiftPM and module cache
        uses: actions/cache@v6
        with:
          path: |
            SourcePackages
            DerivedData/ModuleCache.noindex
          key: ios-${{ runner.os }}-xcode26.6-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ios-${{ runner.os }}-xcode26.6-

      # Newest installed iOS 26 runtime, first iPhone on it.
      - name: Pick simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-26")))
            | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
            | last.value | map(select(.name | startswith("iPhone")))
            | first | "\(.udid) \(.name)"')
          echo "Using simulator: $udid"
          echo "udid=${udid%% *}" >> "$GITHUB_OUTPUT"

      # Same build number source and override as the fastlane upload lanes.
      - name: Pick build number
        id: build_number
        run: echo "number=$(ci_scripts/build_number.sh)" >> "$GITHUB_OUTPUT"

      # No .env in CI: the project's pre-build script writes a placeholder
      # Secrets.plist, so no secrets are needed. Signing is off, so the app has
      # no App Group entitlement; AppGroupContainer falls back to an in-memory
      # store only when running as a unit-test host (a normal launch throws).
      # -disableAutomaticPackageResolution makes xcodebuild use Package.resolved
      # as committed and fail if it is missing or out of date.
      - name: Build
        run: >
          xcodebuild build-for-testing
          -project PokerStats.xcodeproj
          -scheme PokerStats
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath DerivedData
          -clonedSourcePackagesDirPath SourcePackages
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.number }}

      # The app and widget extension must carry the same build number, taken
      # from the override. Also fails if the committed widget Info.plist
      # differs from what xcodegen generates from project.yml.
      - name: Check build numbers
        run: |
          git diff --exit-code -- PokerStatsWidgets/Info.plist
          ci_scripts/check_build_numbers.sh \
            DerivedData/Build/Products/Debug-iphonesimulator/PokerStats.app \
            "${{ steps.build_number.outputs.number }}"

      # The privacy manifests as built, for the record (#115). Fails if the
      # app has none; the widget extension may not have one yet.
      - name: Show privacy manifests
        run: |
          app=DerivedData/Build/Products/Debug-iphonesimulator/PokerStats.app
          plutil -p "$app/PrivacyInfo.xcprivacy"
          widget="$app/PlugIns/PokerStatsWidgets.appex/PrivacyInfo.xcprivacy"
          if [[ -f "$widget" ]]; then
            plutil -p "$widget"
          else
            echo "PokerStatsWidgets.appex has no PrivacyInfo.xcprivacy."
          fi

      # Unit tests only. PokerStatsUITests is the fastlane screenshot suite.
      - name: Test
        run: >
          xcodebuild test-without-building
          -project PokerStats.xcodeproj
          -scheme PokerStats
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath DerivedData
          -resultBundlePath TestResults.xcresult
          -only-testing:PokerStatsTests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  deno:
    name: Edge functions (Deno)
    needs: changes
    if: needs.changes.outputs.deno == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      # Each function has its own deno.json import map, so run per folder.
      - name: Check and test
        run: |
          for dir in supabase/functions/*/; do
            echo "::group::$dir"
            (cd "$dir" && deno check *.ts && deno test --permit-no-files)
            echo "::endgroup::"
          done

  # Fixtures in shared/: the sync API contract (#233), checked against its
  # JSON Schema and the design doc, and the stat fixtures (#235), checked
  # against their reference and definitions. Runs when the Deno job does
  # (supabase/ or shared/ changed).
  shared-fixtures:
    name: Shared fixtures
    needs: changes
    if: needs.changes.outputs.deno == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Sync contract
        working-directory: shared/fixtures/sync
        run: |
          deno check contract.test.ts
          deno test --frozen --allow-read=.,../../../docs

      - name: Stat fixtures
        working-directory: shared/fixtures/stats
        run: |
          deno check stats.test.ts
          deno test --frozen --allow-read=.,../sync

  # pgTAP tests in supabase/tests/ against a local database built from
  # supabase/migrations/ (#234). Only the Postgres container starts; nothing
  # here reaches the live project, and the local stack uses the CLI's default
  # local credentials only. The CLI version pins the Postgres and pg_prove
  # images; the image check below fails if a CLI bump changes Postgres.
  db:
    name: Database tests (pgTAP)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_CLI_VERSION: 2.122.0
      SUPABASE_CLI_SHA256: 59ed066847b98d7461c60e9109d40cab6b9756177ce06ebb05b51338519f5136
      # Repository and tag only: the CLI pulls from ghcr.io or public.ecr.aws
      # depending on where it runs.
      POSTGRES_IMAGE: supabase/postgres:17.11.0.006
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        run: |
          tarball="$RUNNER_TEMP/supabase.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${SUPABASE_CLI_SHA256}  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/supabase-cli"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/supabase-cli" supabase
          echo "$RUNNER_TEMP/supabase-cli" >> "$GITHUB_PATH"

      # Applies every file in supabase/migrations/. stdout (the local
      # connection string) is dropped; progress and errors go to stderr.
      - name: Start the database
        run: |
          supabase --version
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /dev/null

      - name: Check the Postgres image
        run: |
          images=$(docker ps --format '{{.Image}}')
          echo "$images"
          # Drop the registry from each running image and compare the rest.
          while read -r image; do
            [ "${image#*/}" = "$POSTGRES_IMAGE" ] && exit 0
          done <<< "$images"
          echo "Expected <registry>/$POSTGRES_IMAGE" >&2
          exit 1

      - name: Run pgTAP tests
        run: supabase test db

      # The tests must fail when a policy breaks (#234). Loosen one policy in
      # this throwaway local database (never in a migration) and expect named
      # failures. Runs last; the database is discarded below.
      - name: Tests fail when a policy is loosened
        run: |
          db=$(docker ps --filter name=supabase_db_ --format '{{.Names}}')
          docker exec "$db" psql -U postgres -X -v ON_ERROR_STOP=1 -q \
            -c "alter policy profiles_select_own on public.profiles using (true)"
          if supabase test db > "$RUNNER_TEMP/mutation.log" 2>&1; then
            cat "$RUNNER_TEMP/mutation.log"
            echo "pgTAP passed with profiles_select_own using (true)." >&2
            exit 1
          fi
          grep -E '^# Failed test|^Result' "$RUNNER_TEMP/mutation.log"
          grep -q 'Failed test 3: "B sees its own profile and no other"' "$RUNNER_TEMP/mutation.log"

      - name: Stop the database
        if: always()
        run: supabase stop --no-backup > /dev/null

  # The owner submits to App Review by hand. Always runs; it takes seconds.
  fastlane-guard:
    name: Fastlane never submits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Test the guard
        run: .github/scripts/fastlane-no-submit-test.sh

      # Only these paths are scanned. A new release script anywhere else (the
      # repo root, a Makefile, .github/scripts/) must be added here and to
      # dirs in fastlane-no-submit-test.sh. .github/scripts/ stays out because
      # the guard's test file holds true values.
      - name: Check fastlane, workflows and ci_scripts
        run: .github/scripts/fastlane-no-submit.sh fastlane .github/workflows ci_scripts

  # Tag parsing and TestFlight notes for ios-release.yml, and the build
  # number scripts in ci_scripts/. Always runs.
  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Test release scripts
        run: .github/scripts/ios-release-test.sh

      - name: Test build number scripts
        run: .github/scripts/build-numbers-test.sh

  # The ruleset files in .github/rulesets/ and repo-settings-check.sh (#200).
  # Fails if main.json stops requiring the gate job's name. Always runs.
  repo-settings:
    name: Repo settings files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Test rulesets and settings check
        run: .github/scripts/repo-settings-test.sh

  # Every required-reason API category the app or widget extension uses must
  # be declared in that target's PrivacyInfo.xcprivacy (#115). Runs when the
  # iOS job does.
  privacy-manifest:
    name: Privacy manifest declarations
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Test the check
        run: .github/scripts/privacy-api-check-test.sh

      - name: Check the app
        run: .github/scripts/privacy-api-check.sh PokerStats/PrivacyInfo.xcprivacy PokerStats

      # The extension builds PokerStatsWidgets/ plus the shared PokerStats/
      # files listed in project.yml, and needs its own manifest for them.
      # Only each entry's path is read. Excludes and includes are ignored, so
      # this scans more files than the target builds, never fewer. The yq on
      # ubuntu-latest must be mikefarah yq v4 for this expression.
      - name: Check the widget extension
        run: |
          version=$(yq --version)
          [[ "$version" == *mikefarah/yq*" version v4."* ]] || { echo "Need mikefarah yq v4, found: $version" >&2; exit 1; }
          mapfile -t sources < <(yq '.targets.PokerStatsWidgets.sources[] | (.path // .)' project.yml)
          .github/scripts/privacy-api-check.sh PokerStatsWidgets/PrivacyInfo.xcprivacy "${sources[@]}"

  # The one check branch protection requires. Always runs; passes when every
  # job passed or was skipped, fails if any failed or was cancelled.
  gate:
    name: CI passed
    needs: [changes, ios, deno, shared-fixtures, db, fastlane-guard, release-scripts, repo-settings, privacy-manifest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job ended as '$result'."; exit 1 ;;
            esac
          done
