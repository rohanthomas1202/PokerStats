version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    ignore:
      # supabase-swift 2.55.4 requires swift-crypto 3.0.0..<5.0.0, so 5.x
      # can't resolve (PR #212). Remove once supabase-swift allows 5.x.
      - dependency-name: github.com/apple/swift-crypto
        update-types: ["version-update:semver-major"]
